[package]
name = "edirstat-bridge"
version = "0.4.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
edirstat-core = { path = "../edirstat-core" }
ahash = "0.8.12"
bytemuck = { version = "1.25.2", features = ["derive"] }
compact_str = "0.10.0"
crossbeam = "0.8.5"
crc-fast = "1.10.0"
parking_lot = "0.12.5"
rayon = "1.12.0"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
smallvec = "1.16.1"
sysinfo = { version = "0.39.6", default-features = false, features = ["disk"] }
